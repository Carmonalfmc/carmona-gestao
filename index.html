<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARMONA Gestão de Aulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: trilho preto com a marca (lateral no computador, topo e abas no celular), conteúdo em papel claro, dourado só para ação e destaque. */
:root{
  --bg:#F7F6F3; --surface:#FFFFFF; --ink:#121213; --muted:#66635C; --line:#E1DED6;
  --rail:#0B0B0C; --rail-ink:#F3F1EA; --rail-muted:#9B978C;
  --gold:#C9A45C; --gold-ink:#76590F; --gold-soft:#F4ECDA;
  --ok:#1B6E46; --ok-bg:#E3F2EA; --warn:#8A5200; --warn-bg:#FBEBD0; --bad:#A3231C; --bad-bg:#FADFDC; --info-bg:#ECEAE4;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --surface:#18181B; --ink:#F1EFE9; --muted:#A39F95; --line:#2B2B30;
    --rail:#050506; --gold-ink:#DDBE78; --gold-soft:#2A2416;
    --ok:#7FD4A6; --ok-bg:#13291E; --warn:#F0BC6A; --warn-bg:#2E2210; --bad:#F29B94; --bad-bg:#331614; --info-bg:#232327;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#18181B; --ink:#F1EFE9; --muted:#A39F95; --line:#2B2B30;
  --rail:#050506; --gold-ink:#DDBE78; --gold-soft:#2A2416;
  --ok:#7FD4A6; --ok-bg:#13291E; --warn:#F0BC6A; --warn-bg:#2E2210; --bad:#F29B94; --bad-bg:#331614; --info-bg:#232327;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
a{color:var(--gold-ink)}

.app{display:flex;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);width:228px;flex:none;display:flex;flex-direction:column;gap:28px;padding:26px 18px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.wordmark{font-family:var(--display);font-stretch:125%;font-weight:800;font-size:19px;letter-spacing:.3em;color:var(--rail-ink)}
.logo{height:34px;width:auto;display:block;align-self:flex-start}
.topbar .logo{height:22px}
.login{position:fixed;inset:0;background:var(--rail);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;overflow:auto}
.login[hidden]{display:none}
.logincard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;color:var(--rail-ink)}
.logincard .logo{height:52px;margin-bottom:10px}
.logincard h3{font-size:20px;font-weight:800}
.logincard label{color:var(--rail-muted)}
.logincard input{background:#17171A;border-color:#2B2B30;color:#F3F1EA}
.logincard .hint{color:var(--rail-muted)}
.logincard .err{color:#F29B94}
.lnk{border:0;background:transparent;color:var(--gold);cursor:pointer;padding:8px 0;font-weight:600;font-size:14px;text-align:left}
.loginlinks{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:8px;color:var(--rail-muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{color:var(--rail-ink)}
.nav a[aria-current="page"]{color:var(--rail);background:var(--gold);font-weight:600}
.rail .sync{margin-top:auto;font-family:var(--mono);font-size:11px;color:var(--rail-muted);padding:0 8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rail-muted);flex:none}
.dot.ok{background:#5FCB93}.dot.busy{background:var(--gold)}.dot.err{background:#EF7B72}

.main{flex:1;min-width:0;padding:30px 34px 60px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}
.head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.head .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#121213}
.btn.primary:hover{filter:brightness(1.05)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.tile .val{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile.bad .val{color:var(--bad)} .tile.ok .val{color:var(--ok)}
.tile .sub{font-size:12.5px;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.card > header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:150px}
.row .t{font-weight:600}
.row .hora{font-family:var(--mono);font-weight:600;width:52px;flex:none}
.row.click{cursor:pointer}
.row.click:hover .t{text-decoration:underline}
.row .valor{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:92px;text-align:right}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--info-bg);color:var(--ink);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.pill.plain::before{display:none}

.empty{padding:18px 4px;color:var(--muted)}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner strong{font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:150px;display:flex;flex-direction:column}
.day.today{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.day > header{padding:9px 10px 6px;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.day > header b{font-family:var(--mono);font-size:15px;color:var(--ink)}
.slots{display:flex;flex-direction:column;gap:6px;padding:4px 6px 8px;flex:1}
.slot{border:0;text-align:left;background:var(--info-bg);border-radius:7px;padding:7px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--muted)}
.slot:hover{filter:brightness(.97)}
.slot .h{font-family:var(--mono);font-size:12px;font-weight:600}
.slot .n{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.slot .l{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.slot.dada{border-left-color:var(--ok);background:var(--ok-bg)} .slot.falta{border-left-color:var(--bad);background:var(--bad-bg)} .slot.cancelada{opacity:.55;text-decoration:line-through} .slot.agendada{border-left-color:var(--gold)}
.addslot{border:1px dashed var(--line);background:transparent;border-radius:7px;color:var(--muted);cursor:pointer;padding:6px;font-size:12.5px;margin-top:auto}
.addslot:hover{border-color:var(--ink);color:var(--ink)}

.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:22px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 41px,var(--line) 41px 42px)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.bar i{display:block;width:100%;max-width:64px;background:var(--muted);border-radius:5px 5px 0 0;min-height:2px;opacity:.55}
.bar.cur i{background:var(--gold);opacity:1}
.bar span{font-family:var(--mono);font-size:11px;white-space:nowrap}
.chartx{display:flex;gap:10px}.chartx span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
textarea{min-height:92px;resize:vertical}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:22px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line)}
.modal > header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal h3{font-size:19px;font-weight:800}
.modal form{display:flex;flex-direction:column;gap:13px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.x{border:0;background:transparent;cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:6px;color:var(--muted)}
.qr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qr .img{background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line);line-height:0}
.code{font-family:var(--mono);font-size:11.5px;background:var(--info-bg);border-radius:8px;padding:10px;overflow-wrap:anywhere;max-height:84px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.tabbar{display:none}

@media (max-width:900px){
  .rail{display:none}
  .app{flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--rail);color:var(--rail-ink);padding:12px 16px;position:sticky;top:0;z-index:20}
  .topbar .wordmark{font-size:15px}
  .topbar .sync{font-family:var(--mono);font-size:10.5px;color:var(--rail-muted);display:flex;gap:6px;align-items:center}
  .topbar a{color:var(--rail-ink);display:flex;padding:6px}
  .topbar a svg{width:20px;height:20px}
  .main{padding:18px 16px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--rail);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--rail-muted);text-decoration:none;font-size:10.5px;font-weight:600;border-radius:8px;min-height:44px}
  .tabbar a svg{width:20px;height:20px}
  .tabbar a[aria-current="page"]{color:var(--gold)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:minmax(0,1fr)}
  .day{min-height:0}
  h1{font-size:22px}
  .tile .val{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:pop .14s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script>
"use strict";
/* ============ Funções puras (datas, dinheiro, Pix) ============ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayIso=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const monthKey=s=>s.slice(0,7);
const addMonths=(mk,n)=>{const [y,m]=mk.split("-").map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const daysInMonth=mk=>{const [y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate()};
const weekStart=s=>{const d=parseD(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const DOW=["dom","seg","ter","qua","qui","sex","sáb"], MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MESL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const fmtD=s=>{const d=parseD(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
const fmtDL=s=>{const d=parseD(s);return DOW[d.getDay()]+", "+d.getDate()+" "+MES[d.getMonth()]};
const fmtMes=mk=>{const [y,m]=mk.split("-").map(Number);return MESL[m-1]+" de "+y};
const fmtMesC=mk=>{const [y,m]=mk.split("-").map(Number);return MES[m-1]+"/"+y};
const brl=v=>"R$ "+(Number(v)||0).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");
const brlK=v=>{v=Number(v)||0;return v>=1000?"R$ "+(v/1000).toFixed(1).replace(".",",")+" mil":"R$ "+Math.round(v)};
const digits=s=>String(s||"").replace(/\D/g,"");
const semAcento=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,"0")}
function pixChave(chave,tipo){chave=String(chave||"").trim();if(!chave)return"";
  if(tipo==="telefone"){let d=digits(chave);if(d.length<=11)d="55"+d;return"+"+d}
  if(tipo==="cpf")return digits(chave);
  if(tipo==="email")return chave.toLowerCase();
  return chave}
function pixPayload({chave,tipo,nome,cidade,valor}){
  const k=pixChave(chave,tipo);if(!k)return"";
  const f=(id,v)=>id+pad(v.length)+v;
  const conta=f("00","br.gov.bcb.pix")+f("01",k);
  let p=f("00","01")+f("26",conta)+f("52","0000")+f("53","986");
  if(Number(valor)>0)p+=f("54",Number(valor).toFixed(2));
  p+=f("58","BR")+f("59",(semAcento(nome)||"RECEBEDOR").slice(0,25))+f("60",(semAcento(cidade)||"SAO PAULO").toUpperCase().slice(0,15))+f("62",f("05","***"))+"6304";
  return p+crc16(p)}
function vencDoMes(mk,dia){return mk+"-"+pad(Math.min(Math.max(1,Number(dia)||10),daysInMonth(mk)))}
function statusCobranca(c,hoje){if(c.pagoEm)return"pago";return c.venc<(hoje||todayIso())?"atrasado":"aberto"}
function mensalidadesFaltando(S,mk){return S.alunos.filter(a=>a.ativo!==false&&a.plano==="mensal"&&Number(a.valor)>0&&!S.cobrancas.some(c=>c.alunoId===a.id&&c.tipo==="mensalidade"&&c.ref===mk))}
function saldoPacote(S,alunoId){
  const pcs=S.cobrancas.filter(c=>c.alunoId===alunoId&&c.tipo==="pacote");if(!pcs.length)return null;
  const desde=pcs.map(c=>c.criadoEm||c.venc).sort()[0];
  const cred=pcs.reduce((s,c)=>s+(Number(c.qtd)||0),0);
  const fd=!(S.config&&S.config.faltaDesconta===false);
  const usadas=S.aulas.filter(a=>a.alunoId===alunoId&&a.data>=desde&&(a.status==="dada"||(fd&&a.status==="falta"))).length;
  return cred-usadas}
function fillMsg(tpl,v){return String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=>v[k]!==undefined?v[k]:m)}

if(typeof module!=="undefined")module.exports={crc16,pixPayload,pixChave,vencDoMes,statusCobranca,mensalidadesFaltando,saldoPacote,weekStart,addMonths,addDays,brl,fillMsg};

/* ============ Estado ============ */
const LS="carmona_gestao_v1";

      for(let i=0;i<rem.length;i+=200){const lote=rem.slice(i,i+200);const {error}=await SB.from("gestao_"+t).delete().in("id",lote);if(error)throw error;lote.forEach(id=>{delete sinc[t][id]})}}

const SB_SCOUT={
  async listarPartidas(alunoId){
    if(!SB||!USER)return[];
    // coach_id = current user; aluno_id via scout_perfis.aluno_id
    const {data,error}=await SB.from("scout_partidas")
      .select("*")
      .order("data",{ascending:false})
      .limit(20);
    if(error){console.error(error);return[]}
    // filtra pelo aluno selecionado (campo aluno_id armazenado no coach_id=USER.id)
    return(data||[]).filter(p=>p.aluno_id===alunoId);
  },
  async criarPartida(alunoId,oponente,local,data){
    if(!SB||!USER)throw new Error("Sem sessão");
    const id=uid();
    const {error}=await SB.from("scout_partidas").insert({
      id,aluno_id:alunoId,coach_id:USER.id,
      oponente:oponente||"Oponente",local_jogo:local||"",
      data:data||todayIso(),placar:"0-0",sets_placar:"[]",status:"em_andamento"
    });
    if(error)throw error;
    return id;
  },
  async salvarPonto(p){
    if(!SB||!USER)throw new Error("Sem sessão");
    const {error}=await SB.from("scout_pontos").insert(p);
    if(error)throw error;
  },
  async atualizarPlacar(partidaId,placar,setsPlacar,status){
    if(!SB||!USER)return;
    const {error}=await SB.from("scout_partidas").update({
      placar,sets_placar:JSON.stringify(setsPlacar),status
    }).eq("id",partidaId);
    if(error)console.error(error);

async function scoutEntrarPartida(partidaId){
  if(!SB||!USER)return;
  const {data,error}=await SB.from("scout_partidas").select("*").eq("id",partidaId).single();
  if(error||!data){toast("Partida não encontrada");return}
  let sets=[];try{sets=JSON.parse(data.sets_placar||"[]")}catch(e){}
  if(!sets.length)sets=[{vA:0,vO:0,gA:0,gO:0}];
  _scoutPartidaCache={...data,_sets:sets,_fase:"saque",_sacadorAtual:"aluno",_pontoAtual:{set_num:sets.length,game_num:1,ponto_num:1}};
  // carrega pontos existentes para contar
  const {data:pts}=await SB.from("scout_pontos").select("id").eq("partida_id",partidaId);
  _scoutPontos=(pts||[]).map(x=>x.id);
  UI.scoutPartida=partidaId;
  render();
}

function scoutProcessarSaque(v,segundo){
  const p=_scoutPartidaCache;if(!p)return;
  if(v==="ace"){
    // ponto direto
    p[segundo?"_saque2":"_saque1"]=v;
    p._tipo_fim="ace";p._golpe_fim="saque";p._vencedor=p._sacadorAtual;
    _scoutFinalizarPonto();return;
  }
  if(v==="dupla_falta"){
    p._saque1=segundo?"fora":"fora"; p._saque2="dupla_falta";
    p._tipo_fim="dupla_falta";p._golpe_fim="saque";p._vencedor=p._sacadorAtual==="aluno"?"oponente":"aluno";
    _scoutFinalizarPonto();return;
  }
  if(segundo){p._saque2=v;p._fase="rally"}
  else if(v==="fora"||v==="rede"){p._saque1=v;p._fase="saque2"}
  else{p._saque1=v;p._fase="rally"}
  render();
}

function scoutProcessarRally(campo,valor){
  const p=_scoutPartidaCache;if(!p)return;
  if(campo==="vencedor"){p._vencedor=valor}
  else if(campo==="tipo"){p._tipo_fim=valor}
  else if(campo==="golpe"){p._golpe_fim=valor}
  // se tivermos vencedor + tipo ou golpe, salvar automaticamente quando golpe definido
  if(campo==="golpe"){_scoutFinalizarPonto();return}
  render();
}

async function _scoutFinalizarPonto(){
  const p=_scoutPartidaCache;if(!p)return;
  const sets=p._sets;const curSet=sets[sets.length-1];
  const vencedor=p._vencedor||"aluno";
  if(vencedor==="aluno")curSet.gA=(curSet.gA||0)+1;
  else curSet.gO=(curSet.gO||0)+1;

  // montar objeto ponto
  const po={id:uid(),partida_id:p.id,coach_id:USER.id,
    set_num:sets.length,game_num:p._pontoAtual&&p._pontoAtual.game_num||1,ponto_num:(_scoutPontos.length+1),
    sacador:p._sacadorAtual||"aluno",
    saque1:p._saque1||null,saque2:p._saque2||null,saque_forcou:false,
    vencedor,tipo_fim:p._tipo_fim||null,
    golpe_fim:p._golpe_fim||null,destino_fim:null,zona_fim:null,num_bolas:1
  };
  _scoutPontos.push(po.id);
  SB_SCOUT.salvarPonto(po).catch(e=>console.error("Erro ao salvar ponto",e));

  // verificar game
  const gA=curSet.gA,gO=curSet.gO;
  if(scoutGameFim(gA,gO)){
    if(vencedor==="aluno")curSet.vA=(curSet.vA||0)+1;else curSet.vO=(curSet.vO||0)+1;
    curSet.gA=0;curSet.gO=0;
    // trocar saque a cada game
    p._sacadorAtual=p._sacadorAtual==="aluno"?"oponente":"aluno";
    // verificar set
    if(scoutSetFim(curSet.vA,curSet.vO)){
      sets.push({vA:0,vO:0,gA:0,gO:0});
      const sA=sets.filter(s=>s.vA>s.vO).length,sO=sets.filter(s=>s.vO>s.vA).length;
      const placar=sA+"-"+sO,status=(sA>=2||sO>=2)?"finalizada":"em_andamento";
      SB_SCOUT.atualizarPlacar(p.id,placar,sets,status).catch(console.error);
      if(status==="finalizada"){toast("Partida encerrada! "+placar);UI.scoutPartida=null;_scoutPartidaCache=null;render();return}
    }
  }
  // reiniciar fase
  p._fase="saque";p._saque1=null;p._saque2=null;p._vencedor=null;p._tipo_fim=null;p._golpe_fim=null;
  SB_SCOUT.atualizarPlacar(p.id,sets.filter(s=>s.vA>s.vO).length+"-"+sets.filter(s=>s.vO>s.vA).length,sets,"em_andamento").catch(console.error);
  render();
}

  "scout-vencedor":d=>scoutProcessarRally("vencedor",d.v),
  "scout-tipo":d=>scoutProcessarRally("tipo",d.v),
  "scout-golpe":d=>scoutProcessarRally("golpe",d.v),
  "scout-desfazer":()=>{
    const p=_scoutPartidaCache;if(!p)return;
    p._fase="saque";p._saque1=null;p._saque2=null;p._vencedor=null;p._tipo_fim=null;p._golpe_fim=null;
    render();toast("Ponto desfeito — registre novamente")
  },
  "scout-encerrar":()=>confirmar("Encerrar esta partida agora?","Encerrar",async()=>{
    const p=_scoutPartidaCache;if(!p)return;
    const sets=p._sets||[];
    const sA=sets.filter(s=>s.vA>s.vO).length,sO=sets.filter(s=>s.vO>s.vA).length;
    await SB_SCOUT.atualizarPlacar(p.id,sA+"-"+sO,sets,"finalizada").catch(console.error);
    _scoutPartidaCache=null;UI.scoutPartida=null;render();toast("Partida encerrada — "+sA+"-"+sO)
  })
};
if(typeof document!=="undefined"){
  document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;const f=ACT[el.dataset.act];if(f)f(el.dataset,el,ev)});
  document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$(".overlay"))fechar()});
  window.addEventListener("hashchange",()=>{fechar();rota()});
  S=carregar()||exemplo();
  rota();
  iniciarNuvem();
}
</script>
</body>
</html>
